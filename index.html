<!doctype html>
<html lang="ru">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Aidoku Sources for Russians</title>
		<meta
			name="description"
			content="Русскоязычные источники для Aidoku."
		/>
		<style>
			:root {
				color-scheme: light dark;
				font-family:
					-apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
			}

			body {
				margin: 0;
				min-height: 100vh;
				display: grid;
				place-items: center;
				padding: 24px;
				background: Canvas;
				color: CanvasText;
			}

			main {
				width: min(100%, 560px);
			}

			h1 {
				font-size: 34px;
				line-height: 1.1;
				margin: 0 0 12px;
			}

			p {
				font-size: 17px;
				line-height: 1.5;
				margin: 0 0 22px;
				color: color-mix(in srgb, CanvasText 72%, transparent);
			}

			a.button {
				display: inline-flex;
				align-items: center;
				justify-content: center;
				min-height: 48px;
				padding: 0 20px;
				border-radius: 8px;
				background: #ff2d55;
				color: white;
				font-weight: 700;
				text-decoration: none;
			}

			code {
				display: block;
				overflow-wrap: anywhere;
				margin-top: 18px;
				padding: 14px;
				border-radius: 8px;
				background: color-mix(in srgb, CanvasText 8%, transparent);
				font-size: 13px;
			}
		</style>
	</head>
	<body>
		<main>
			<h1>Aidoku Sources for Russians</h1>
			<p>Русскоязычные источники для Aidoku. Откройте эту страницу на устройстве с Aidoku и нажмите кнопку.</p>
			<a
				class="button"
				href="aidoku://addSourceList?url=https://sw1tchtaks.github.io/aidoku-sources-for-russians/index.min.json"
			>
				Добавить в Aidoku
			</a>
			<code>https://sw1tchtaks.github.io/aidoku-sources-for-russians/index.min.json</code>
		</main>
	</body>
</html>
